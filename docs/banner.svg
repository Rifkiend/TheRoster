<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="TheRoster — One team. Every AI. Zero guesswork.">
  <rect width="1280" height="360" fill="#0d1117"/>
  <rect x="1" y="1" width="1278" height="358" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- divider -->
  <line x1="860" y1="60" x2="860" y2="300" stroke="#21262d" stroke-width="1"/>

  <!-- left: wordmark -->
  <text x="80" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-1">TheRoster</text>
  <text x="80" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#8b949e">One team. Every AI. Zero guesswork.</text>

  <!-- version pill -->
  <rect x="80" y="246" width="252" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="206" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2" fill="#8b949e" text-anchor="middle">AGENT SKILLS · v2.6.0</text>

  <!-- right: roster motif -->
  <line x1="920" y1="150" x2="1210" y2="150" stroke="#30363d" stroke-width="2"/>

  <g>
    <circle cx="950" cy="150" r="44" fill="#58a6ff"/>
    <circle cx="950" cy="141" r="10" fill="#0d1117"/>
    <path d="M 932 168 A 18 14 0 0 1 968 168 Z" fill="#0d1117"/>
  </g>
  <g>
    <circle cx="1045" cy="150" r="44" fill="#3fb950"/>
    <circle cx="1045" cy="141" r="10" fill="#0d1117"/>
    <path d="M 1027 168 A 18 14 0 0 1 1063 168 Z" fill="#0d1117"/>
  </g>
  <g>
    <circle cx="1140" cy="150" r="44" fill="#d29922"/>
    <circle cx="1140" cy="141" r="10" fill="#0d1117"/>
    <path d="M 1122 168 A 18 14 0 0 1 1158 168 Z" fill="#0d1117"/>
  </g>

  <!-- status chip -->
  <rect x="950" y="238" width="240" height="46" rx="23" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <path d="M 976 261 l 7 7 l 13 -13" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1004" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3">roster loaded</text>
</svg>
